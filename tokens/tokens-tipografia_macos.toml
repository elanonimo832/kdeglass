# Valores en 1/1000 em (el estandar de las herramientas) y en puntos.
# Necesario para que el texto parezca de macOS: el espaciado entre
# letras cambia con el tamano, no es constante.
#   em1000 = valor para usar como letter-spacing en CSS/QSS
