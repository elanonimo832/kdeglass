# tokens-tipografia_macos.toml — GENERADO. No editar a mano.
#
# TIPOGRAFIA DE macOS, extraida de las Human Interface Guidelines oficiales.
# Fuente: https://developer.apple.com/design/human-interface-guidelines/typography
# Datos:   https://developer.apple.com/tutorials/data/design/human-interface-guidelines/typography.json
# Fecha:   2026-10-13
#
# Esto CIERRA el hueco de tipografia del proyecto: son valores publicados por
# Apple, no medidos ni inferidos. Cada uno es trazable a las HIG.
#
# AVISO SOBRE LA FUENTE TIPOGRAFICA: macOS usa SF Pro, que Apple NO permite
# redistribuir. El proyecto usara Inter (SIL OFL). Los tamanos, interlineados y
# pesos de este fichero se aplican tal cual; el TRACKING es especifico de SF Pro,
# asi que con otra familia es una aproximacion de partida a ajustar a ojo.
#
# AVISO: macOS NO soporta Dynamic Type (lo dicen las propias HIG). Por eso aqui
# hay UNA sola escala, no doce como en iOS. No hay que buscar variantes.

[_meta]
fuente = "https://developer.apple.com/design/human-interface-guidelines/typography"
plataforma = "macOS"
tokens = 80
fecha_extraccion = "2026-10-13"

[tamano_base]
# Tamano recomendado por Apple para cada plataforma.
ios = { por_defecto = 17, minimo = 11 }
macos = { por_defecto = 13, minimo = 10 }
tvos = { por_defecto = 29, minimo = 23 }
visionos = { por_defecto = 17, minimo = 12 }
watchos = { por_defecto = 16, minimo = 12 }

[estilos]
# ESTILOS DE TEXTO DE macOS. Tabla oficial de las HIG.
# `peso` y `peso_enfatizado` son valores numericos CSS/fontconfig.
# `interlineado` es el leading en puntos. `interlineado_escala` su relacion.
# Large Title: Regular 26pt / leading 32pt
large_title = { tamano = 26, interlineado = 32, interlineado_escala = 1.231, peso = 400, peso_enfatizado = 700 }
# Title 1: Regular 22pt / leading 26pt
title_1 = { tamano = 22, interlineado = 26, interlineado_escala = 1.182, peso = 400, peso_enfatizado = 700 }
# Title 2: Regular 17pt / leading 22pt
title_2 = { tamano = 17, interlineado = 22, interlineado_escala = 1.294, peso = 400, peso_enfatizado = 700 }
# Title 3: Regular 15pt / leading 20pt
title_3 = { tamano = 15, interlineado = 20, interlineado_escala = 1.333, peso = 400, peso_enfatizado = 600 }
# Headline: Bold 13pt / leading 16pt
headline = { tamano = 13, interlineado = 16, interlineado_escala = 1.231, peso = 700, peso_enfatizado = 800 }
# Body: Regular 13pt / leading 16pt
body = { tamano = 13, interlineado = 16, interlineado_escala = 1.231, peso = 400, peso_enfatizado = 600 }
# Callout: Regular 12pt / leading 15pt
callout = { tamano = 12, interlineado = 15, interlineado_escala = 1.25, peso = 400, peso_enfatizado = 600 }
# Subheadline: Regular 11pt / leading 14pt
subheadline = { tamano = 11, interlineado = 14, interlineado_escala = 1.273, peso = 400, peso_enfatizado = 600 }
# Footnote: Regular 10pt / leading 13pt
footnote = { tamano = 10, interlineado = 13, interlineado_escala = 1.3, peso = 400, peso_enfatizado = 600 }
# Caption 1: Regular 10pt / leading 13pt
caption_1 = { tamano = 10, interlineado = 13, interlineado_escala = 1.3, peso = 400, peso_enfatizado = 500 }
# Caption 2: Medium 10pt / leading 13pt
caption_2 = { tamano = 10, interlineado = 13, interlineado_escala = 1.3, peso = 500, peso_enfatizado = 600 }

[tracking]
