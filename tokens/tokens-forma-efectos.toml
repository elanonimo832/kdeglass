# tokens-forma-efectos.toml — GENERADO. No editar a mano.
#
# LO QUE FALTABA: forma de ventana, sombras, borde capilar y material.
# Extraido de las PROPIEDADES DE NODO del .fig, que es donde viven estos valores.
# No son variables, por eso no salian en la exportacion de Variables de Figma.
#
# Fuente: macOS 27 (Community).fig, version de esquema 106, 19011 nodos.
# Herramienta: herramientas/figma/extraer-fig.py
#
# AVISO: los radios 100 y 1000 del kit son PROPORCIONES de Figma (circulo y
# pildora), no puntos. Estan en [radio_proporcional].

[_meta]
fuente = "macOS 27 (Community).fig"
nodos = 19011
esquema_version = 106
tokens = 150

[radio]
# Escala completa de radios de esquina, en puntos. `n` = nodos que lo usan.
# Los de n alto son los del sistema: 5 (n=1315), 6 (n=1172) y 8 (n=1142) dominan.
# n=41
r0_5 = 0.5
# n=58
r1_0 = 1
# n=4
r1_5 = 1.5
# n=99
r2_0 = 2
# n=19
r2_5 = 2.5
# n=77
r3_0 = 3
# n=24
r3_5 = 3.5
# n=129
r4_0 = 4
# n=4
r4_5 = 4.5
# n=698
r5_0 = 5
# n=46
r5_5 = 5.5
# n=950
r6_0 = 6
# n=571
r8_0 = 8
# n=118
r10_0 = 10
# n=12
r12_0 = 12
# n=9
r15_0 = 15
# n=96
r16_0 = 16
# n=100
r20_0 = 20
# n=1
r22_0 = 22
# n=1
r26_0 = 26
# n=8
r30_0 = 30
# n=8
r34_0 = 34
# n=3
r36_0 = 36

[radio_proporcional]
# Valores que en Figma significan proporcion, no puntos:
circulo = 100    # radio = mitad del lado
pildora = 1000   # radio = mitad de la altura (forma de pastilla)

[squircle]
# EL DATO DEL BRIEF: 'squircle obligatorio'. Asi se declara en Figma.
# cornerSmoothing = 0 -> esquina circular normal (un arco).
# cornerSmoothing > 0 -> superelipse: curva CONTINUA, sin el cambio brusco de
# curvatura donde el arco se junta con el lado recto. Es lo que hace que las
# esquinas de Apple no parezcan 'cortadas'. 2244 nodos del kit lo usan.

smoothing = 0.6
umbral_circular = 0.0
umbral_maximo = 1.0

[ventana.sombra]
# La sombra de ventana de macOS son DOS capas superpuestas, no una:
#   1) difusa y amplia  -> da la elevacion
#   2) de contacto, minima y mas opaca -> 'asienta' el borde y lo mantiene nitido
# Esa pareja es la razon de que la ventana se vea elevada Y definida a la vez.
# Una sola sombra da o bien un borde sucio o bien una elevacion falsa.
# [Window BG] n=1
capa_difusa = { radio = 54, offset_x = 0, offset_y = 18, alfa = 0.3 }
# [Window BG] n=1
capa_contacto = { radio = 1, offset_x = 0, offset_y = 0, alfa = 0.8 }

[ventana.sombra_interior]
# Sombra interior del marco de ventana. Distinta en claro y oscuro:
# [Shadows - Dark/Window Inner Shadow]
oscuro = { radio = 1, offset_y = 0, alfa = 0.2 }

[ventana.sombra_estado]
# [Mode=Light, Active=True, Window Type=Unified Toolbar + Title] n=1
capa_difusa = { radio = 54, offset_y = 18, alfa = 0.3 }
capa_contacto = { radio = 1, offset_y = 0, alfa = 0.8 }

[material]
# El kit define un TIPO DE EFECTO propio: GLASS. Su parametro principal es el radio.
# No es un blur: es una capa de vidrio con su propio desplazamiento y opacidad.
glass_radio    = 26    # valor de referencia (24 usos en el kit)
glass_radio_sm = 16
glass_radio_xs = 6
glass_offset_y = 4
glass_alfa     = 0.25

# Difuminados de fondo. El NOMBRE del nodo codifica el grosor del material:
# el kit tiene Ultra Thin / Thin / Medium / Thick / Ultra Thick, y todos
# comparten radio 60. La diferencia de grosor NO es el radio del difuminado.
blur_ultra_thin  = 60
blur_thin        = 60
blur_medium      = 60
blur_thick       = 60
blur_ultra_thick = 60
blur_selection   = 60
blur_medium_bg   = 30
blur_luminosity  = 120
blur_generico    = 100
blur_tooltip     = 20
blur_scroll_edge = 6

[borde_capilar]
# El borde de 1 pt es la firma del 'bezel' de macOS. El color NO es un gris
# propio: es el primitivo de velo con alfa bajo, que es lo que lo hace
# funcionar sobre cualquier fondo.
grosor            = 1
grosor_fino       = 0.5    # pantallas @2x
alfa_borde        = 0.08   # = Fills - Opaque / Secondary
alfa_borde_fuerte = 0.1

[texto_por_uso]
# Combinaciones tamano/interlineado mas usadas en el kit, por numero de nodos.
# COINCIDEN CON LA TABLA OFICIAL DE LAS HIG, lo cual valida las dos fuentes:
#   13/16 = Body     11/14 = Subheadline   15/20 = Title 3
#   10/13 = Footnote 17/22 = Title 2       22/26 = Title 1   26/32 = Large Title
# Interior: si el interlineado del kit fuera inventado, no cuadraria con las HIG.
# El unico valor frecuente que NO es un estilo de las HIG es 13/22 (iconos).
